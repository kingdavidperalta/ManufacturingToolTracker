name: .NET Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ManufacturingToolTracker.slnx

      - name: Build solution
        run: dotnet build ManufacturingToolTracker.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ManufacturingToolTracker.slnx --configuration Release --no-build
